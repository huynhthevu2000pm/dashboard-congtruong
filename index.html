<!DOCTYPE html>
<html lang="vi">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Công Trường</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h2>📊 Dashboard Công Trường</h2>

<div class="buttons">
    <button onclick="filterData('ALL')">ALL</button>
    <button onclick="filterData('VQC')">VQC</button>
    <button onclick="filterData('CLC')">CLC</button>
    <button onclick="filterData('CC14')">CC14</button>
</div>

<div class="cards">
    <div class="card">👷 Tổng nhân lực: <span id="manpower">0</span></div>
    <div class="card">📈 Tiến độ: <span id="progress">0%</span></div>
</div>

<canvas id="chart"></canvas>

<script src="app.js"></script>

</body>
</html>
